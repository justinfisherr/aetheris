name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_zXzMunM9NwscXMx0d5CI9eP3
  VERCEL_PROJECT_ID: prj_fjBAbHTs1N0siogYMBJXop52roy0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g vercel@latest
      # builds on Vercel: local prebuild emits a discontinued node20 runtime for nitro
      - run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
